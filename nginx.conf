server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Astro emits pretty-URL directories (foo/index.html). Resolve trailing-slash
	# and extensionless URLs, and serve the built 404 page otherwise.
	location / {
		try_files $uri $uri/ $uri.html $uri/index.html =404;
	}

	error_page 404 /docs/404.html;

	# Long-cache the fingerprinted asset bundle.
	location /docs/_astro/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
